<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Страница не найдена — Арсентьева Консалт</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --orange: #F97B3A;
  --orange-light: #FEF0E8;
  --dark: #3D2E24;
  --text: #2C2C28;
  --muted: #7A7A72;
  --border: #E8E4DC;
  --bg: #FAFAF8;
}
html, body { height: 100%; }
body {
  font-family: 'Jost', sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  text-align: center;
  padding: 40px 24px;
}
.wrap { max-width: 480px; }
.monogram {
  font-family: 'Playfair Display', serif;
  font-size: 80px;
  color: rgba(249,123,58,0.22);
  letter-spacing: -3px;
  line-height: 1;
  margin-bottom: 12px;
}
.code {
  font-size: 11px;
  letter-spacing: 4px;
  color: rgba(249,123,58,0.55);
  text-transform: uppercase;
  margin-bottom: 40px;
}
.line {
  width: 1px;
  height: 48px;
  background: linear-gradient(to bottom, transparent, rgba(249,123,58,0.4), transparent);
  margin: 0 auto 40px;
}
h1 {
  font-family: 'Playfair Display', serif;
  font-size: clamp(24px, 5vw, 36px);
  font-weight: 400;
  color: var(--dark);
  line-height: 1.3;
  margin-bottom: 16px;
}
p {
  font-size: 15px;
  color: var(--muted);
  line-height: 1.7;
  margin-bottom: 40px;
}
.btn {
  display: inline-block;
  padding: 14px 36px;
  background: var(--orange);
  color: #fff;
  text-decoration: none;
  font-size: 13px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  font-weight: 500;
  transition: opacity 0.2s;
}
.btn:hover { opacity: 0.88; }
</style>
</head>
<body>
<div class="wrap">
  <div class="monogram">АА</div>
  <div class="code">404</div>
  <div class="line"></div>
  <h1>Страница не найдена</h1>
  <p>Возможно, адрес введён с ошибкой или страница была перемещена.<br>Вернитесь на главную — там есть всё необходимое.</p>
  <a href="/" class="btn">На главную</a>
</div>
</body>
</html>
